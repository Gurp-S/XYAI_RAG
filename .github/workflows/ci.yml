name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run P0 gate unit tests
        run: ./mvnw -B -q test
          -Dtest=SecurityPathPoliciesTest,RsaKeyLoaderTest,RateLimitPointcutTest,ExceptionControllerTest,StubComponentsTest

  admin-frontend:
    name: Admin frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: newXyAdmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: newXyAdmin/package-lock.json
      - run: npm ci
      - run: npm run build

  user-frontend:
    name: User frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xyUser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: xyUser/package-lock.json
      - run: npm ci
      - run: npm run build
