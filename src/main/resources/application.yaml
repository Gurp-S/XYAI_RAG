app:
  memory:
    store: mysql

logging:
  level:
    org.XYai.myai: debug
ragent:
  trace:
    enabled: true  # 生产环境启用，用于问题排查和性能监控
    # enabled: false  # 开发环境可关闭，提升性能
upload:
  ragEnabled: true
  ossEnabled: false
  upLoadEnabled: true
memory:
    history-keep-turns: 4
    summary-start-turns: 8
    summary-max-chars: 300
    summary-enabled: true
rewriter:
  rewriter-min-chars: 50
  rewriter-enabled: false
intent:
  intent-enabled: false
  update-intent-enabled: true
  redis-enabled: true
  DBEnabled: true
  vector-enabled: false
aliyun:
  oss:
    # Moved secrets to application-local.yaml which is git-ignored.
    # Provide values via environment variables in CI or local application-local.yaml for development.
    endpoint: ${ALIOSS_ENDPOINT:oss-cn-shanghai.aliyuncs.com}
    access-key-id: ${ALIOSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIOSS_ACCESS_KEY_SECRET:}
    bucket: ${ALIOSS_BUCKET_NAME:}
    basePath: optional/base/path/
    publicRead: true
splitter:
  chunk-size: 1200
  overlap: 200
  chinese-tokenize: true
pipeline:
  enricher-enable: true
milvus:
  delete-count-collection-threshold: 1
  delete-count-file-threshold: 1
  delete-count-threshold: 3
tool:
  amap:
    api-key: daceb403e4a6c3d58c283d8a4db885eb
    enabled: true
  bilibili:
    enabled: true
