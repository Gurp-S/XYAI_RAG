# yaml-language-server: $schema=https://raw.githubusercontent.com/spring-io/spring-boot/main/spring-boot-project/spring-boot-configuration-processor/src/test/resources/schema.json
spring:
  application:
    name: My-AI
  profiles:
    active: local
  threads:
    virtual:
      enabled: true   # Tomcat 请求处理改用虚拟线程（Java21），万级并发连接不占平台线程
  server:
    address: "::"
    port: 8080
  datasource:
    url: ${SPRING_MYSQL_URL:jdbc:mysql://localhost:3306/my_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_MYSQL_USERNAME:}
    password: ${SPRING_MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50      # 高并发 JDBC 池（阻塞型连接，须与虚拟线程解耦）
      minimum-idle: 10
      connection-timeout: 5000
      max-lifetime: 1800000
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/MYsql.sql
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      database: ${SPRING_REDIS_DB:0}
      timeout: 3s
      lettuce:
        pool:
          max-active: 64         # 高并发 Redis 连接池
          max-idle: 32
          min-idle: 8
  servlet:
    multipart:
      max-file-size: 100MB      # 单个文件最大大小
      max-request-size: 100MB
  neo4j:
    uri: bolt://localhost:7687
    pool:
      max-connection-pool-size: 300   # 高并发图查询池（默认100，压测中排队满）
      connection-acquisition-timeout: 5s
    authentication:
      username: ${spring.neo4j.authentication.username}
      password: ${spring.neo4j.authentication.username:}
  ai:
    # OpenAI兼容模式（统一使用阿里云百炼）
    openai:
      api-key: ${ALIYUN_BAILIAN_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-turbo  # 默认使用最强模型
          temperature: 0.3
          max-tokens: 1000
      embedding:
        options:
          model: text-embedding-v4

    # Anthropic兼容模式（同样通过百炼）
    anthropic:
      api-key: ${ALIYUN_BAILIAN_API_KEY:}
      chat:
        options:
          model: claude-3-sonnet-20240229


    # 本地Ollama
    ollama:
      base-url: http://localhost:11434
      embedding:
        enabled: false
        options:
          model: qwen3-embedding:0.6b
      rerank:
        options:
          model: qwen3-reranker-0.6b
    # Milvus向量存储
    vectorstore:
      milvus:
        client:
          host: localhost
          port: 19530
        database-name: my_xy
        collection-name: my_ai
        embedding-dimension: 768
        metric-type: COSINE
        initialize-schema: true
        index-type: ivf_flat
        index-params:
          nlist: 1024
    # MCP客户端配置
    mcp:
      client:
        toolcallback:
          enabled: true
        name: mcp-client
        type: async
    kafka:
      bootstrap-servers: localhost:9092
      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        properties:
          spring.json.type.mapping: >
            fileUploadEvent:com.XYai.myai.rag.kafka.event.FileUploadEvent,
            chunkEvent:com.XYai.myai.rag.kafka.event.ChunkEvent,
            aclCommandEvent:com.XYai.myai.rag.kafka.event.AclCommandEvent,
            analyticsEvent:com.XYai.myai.rag.kafka.event.AnalyticsEvent,
            memoryEvent:com.XYai.myai.rag.kafka.event.MemoryEvent,
            neo4jEvent:com.XYai.myai.rag.kafka.event.Neo4jEvent,
            traceLogEvent:com.XYai.myai.rag.kafka.event.TraceLogEvent
      consumer:
        group-id: xyai-default
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
        properties:
          spring.json.type.mapping: >
            com.XYai.myai.rag.kafka.event.FileUploadEvent:fileUploadEvent,
            com.XYai.myai.rag.kafka.event.ChunkEvent:chunkEvent,
            com.XYai.myai.rag.kafka.event.AclCommandEvent:aclCommandEvent,
            com.XYai.myai.rag.kafka.event.AnalyticsEvent:analyticsEvent,
            com.XYai.myai.rag.kafka.event.MemoryEvent:memoryEvent,
            com.XYai.myai.rag.kafka.event.Neo4jEvent:neo4jEvent,
            com.XYai.myai.rag.kafka.event.TraceLogEvent:traceLogEvent
          spring.json.trusted.packages: "*"
        enable-auto-commit: false
        auto-offset-reset: earliest
      listener:
        ack-mode: manual


# 模型路由配置（顶级配置）
router:
  strategy: failover  # failover: 降级切换, latency_based: 延迟优先, round_robin: 轮询
  first-packet-timeout: 5000  # 首包探测超时(ms)
  cascade-timeout: 30000      # 级联调用总超时(ms)
  enable-first-packet-detect: true  # 是否启用首包探测
  candidates:
    - name: qwen-turbo
      display-name: 通义千问-3.5-flash
      api-model: qwen-turbo
      priority: 1
      enabled: true
      circuit-breaker:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
        sliding-window-size: 10
        minimum-number-of-calls: 5

    - name: qwen3.6-flash
      display-name: 通义千问-3.6-flash
      api-model: qwen3.6-flash
      priority: 2
      enabled: true
      circuit-breaker:
        failure-rate-threshold: 40
        wait-duration-in-open-state: 8000
        sliding-window-size: 10
        minimum-number-of-calls: 5

    - name: qwen-flash
      display-name: 通义千问-Flash
      api-model: qwen3.5-flash
      priority: 3
      enabled: true
      circuit-breaker:
        failure-rate-threshold: 30
        wait-duration-in-open-state: 5000
        sliding-window-size: 10
        minimum-number-of-calls: 5

    - name: qwen3.5-122b-a10b
      display-name: 通义千问3.5-122b-a10b
      api-model: qwen3.5-122b-a10b
      priority: 4
      enabled: true
      circuit-breaker:
        failure-rate-threshold: 45
        wait-duration-in-open-state: 15000
        sliding-window-size: 10
        minimum-number-of-calls: 5

    - name: qwen3.5-397b-a17b
      display-name: qwen3.5-397b-a17b
      api-model: qwen3.5-397b-a17b
      priority: 5
      enabled: true
      circuit-breaker:
        failure-rate-threshold: 40
        wait-duration-in-open-state: 20000
        sliding-window-size: 10
        minimum-number-of-calls: 5

# Resilience4j全局配置（与router配合使用）
resilience4j:
  circuit-breaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 5
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      qwen-max-breaker:
        base-config: default
      qwen-plus-breaker:
        base-config: default
        failure-rate-threshold: 40
      deepseek-breaker:
        base-config: default
        failure-rate-threshold: 45
  time-limiter:
    instances:
      ai-call:
        timeout-duration: 30s

# 其他业务配置
logging:
  level:
    com.XYai.myai: info
    io.github.resilience4j: info  # 查看熔断器状态变化

ragent:
  trace:
    enabled: true

upload:
  ragEnabled: true
  ossEnabled: false
  upLoadEnabled: true

memory:
  history-keep-turns: 4
  summary-start-turns: 8
  summary-max-chars: 300
  summary-enabled: true

rewriter:
  rewriter-min-chars: 50
  rewriter-enabled: false

intent:
  intent-enabled: false
  update-intent-enabled: true
  redis-enabled: true
  DBEnabled: false
  vector-enabled: true

aliyun:
  oss:
    endpoint: ${ALIOSS_ENDPOINT:oss-cn-shanghai.aliyuncs.com}
    access-key-id: ${ALIOSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIOSS_ACCESS_KEY_SECRET:}
    bucket: ${ALIOSS_BUCKET_NAME:}
    basePath: optional/base/path/
    publicRead: true


pipeline:
  enricher-enable: true

milvus:
  delete-count-collection-threshold: 1
  delete-count-file-threshold: 1
  delete-count-threshold: 3

tool:
  amap:
    api-key: ${tool.amap.api-key:}
    enabled: true
  bilibili:
    enabled: true
  common-tools:
    enabled: true

jwt:
  issuer: XYai
  access-token-exp-sec: 900
  refresh-token-exp-sec: 1209600
  refresh-cookie-name: refresh_token
  http-secure: true
  # Prefer PEM from env/secret store in production. File path is local-dev fallback only.
  rsa-private-key: ${JWT_RSA_PRIVATE_KEY:}
  rsa-public-key: ${JWT_RSA_PUBLIC_KEY:}
  rsa-private-key-path: ${JWT_RSA_PRIVATE_KEY_PATH:file:./config/keys/private_pkcs8.pem}
  rsa-public-key-path: ${JWT_RSA_PUBLIC_KEY_PATH:file:./config/keys/public_x509.pem}

# ============ Web 容器高并发配置（虚拟线程 + 大连接数） ============
server:
  tomcat:
    threads:
      max: 400            # 平台线程兜底上限（开启虚拟线程后请求处理不占这些线程）
      min-spare: 25
    max-connections: 16384  # 最大并发连接数（SSE 长连接场景需远大于线程数）
    accept-count: 2000      # TCP 排队上限
    connection-timeout: 5s
    keep-alive:
      max-keep-alive-requests: 100000
      timeout: 120s         # SSE 流式响应保活

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

rag:
  retrieval:
    # 分块粒度：512 token 子块 + 64 重叠（父子切片 small-to-big，生成用 parent_text 章节全文）
    max-chunk-size: 512
    chunk-overlap: 64
    min-merge-size: 32
    semantic-split-threshold: 0.6
    # 召回深度与精排保留数
    channel-top-k: 20
    final-top-k: 8
    # 召回后过滤阈值（BM25 为 max 归一分，阈值须低于向量阈值）
    common-score-threshold: 0.5
    high-score-threshold: 0.85
    low-score-threshold: 0.2
    vector-only-threshold: 0.5
    bm25-score-threshold: 0.35
    # 重排门槛（相对+绝对）：cutoff = max(min, top分数×relative)，过滤后至少保留 keep-top 条
    # 2026-09-09 压测定稿：0.6/2 配合元数据加权在黄金集取得 P=0.840/R=1.0/Hit=1.0
    min-rerank-score: 0.1
    rerank-gate-relative: 0.6
    rerank-gate-keep-top: 2
    # 元数据加权：查询词命中 fileName/section_path 时按覆盖率加成分数（同主题多文档区分）
    metadata-boost-enabled: true
    metadata-boost-weight: 0.12
    # 文档级整合：按来源文档分组，弱源文档候选分数 < 最优文档分×ratio 剔除（同主题多文档不互相稀释）
    # 压测扫描：ratio 0.8→0.940, 0.9→0.947, 0.95→0.942，0.9 为最优
    doc-consolidation-enabled: true
    doc-keep-ratio: 0.9
    # 分数落差自适应截断（elbow）：Top-K 窗口内相邻分差超过阈值提前截断，剔除长尾噪声
    score-elbow-enabled: true
    score-elbow-gap: 0.12
    # 重排：dashscope（百炼 gte-rerank）| ollama | off
    rerank-provider: dashscope
    rerank-l-lm: true
    # CRAG 质量门控：证据分 = top × 支撑度系数(0.7~1.0)，支撑块=融合分≥floor 的候选
    quality-gate-retry-enabled: true
    quality-gate-threshold: 0.45
    quality-gate-support-floor: 0.3
    quality-gate-support-target: 3
  rerank:
    dashscope:
      model: gte-rerank-v2
      base-url: https://dashscope.aliyuncs.com


