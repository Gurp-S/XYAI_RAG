spring:
  application:
    name: My-AI
  profiles:
    active: local
  datasource:
    url: ${SPRING_MYSQL_URL:jdbc:mysql://localhost:3306/my_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    # Move sensitive defaults into application-local.yaml or environment variables
    username: ${SPRING_MYSQL_USERNAME:}
    password: ${SPRING_MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/MYsql.sql
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      database: ${SPRING_REDIS_DB:0}
      timeout: 3s
  ai:
    openai:
      api-key: ${ALIYUN_BAILIAN_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen3-max
          temperature: 0.1
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: qwen3-embedding
    vectorstore:
      milvus:
        client:
          host: localhost
          port: 19530
        databaseName: my_xy
        collectionName: my_ai
        embeddingDimension: 4096
        metricType: COSINE
        initialize-schema: true
        index-type: ivf_flat
        index-params:
          nlist: 1024


app:
  memory:
    store: mysql

logging:
  level:
    org.XYai.myai: debug
ragent:
  trace:
    enabled: true  # 生产环境启用，用于问题排查和性能监控
    # enabled: false  # 开发环境可关闭，提升性能
upload:
  ragEnabled: true
  ossEnabled: false
  upLoadEnabled: true
memory:
    history-keep-turns: 4
    summary-start-turns: 4
    summary-max-chars: 300
    summary-enabled: true
rewriter:
  rewriter-min-chars: 50
  rewriter-enabled: true
intent:
  intent-enabled: true
  update-intent-enabled: true
  redis-enabled: true
  DBEnabled: true
  vector-enabled: false
aliyun:
  oss:
    # Moved secrets to application-local.yaml which is git-ignored.
    # Provide values via environment variables in CI or local application-local.yaml for development.
    endpoint: ${ALIOSS_ENDPOINT:oss-cn-shanghai.aliyuncs.com}
    access-key-id: ${ALIOSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIOSS_ACCESS_KEY_SECRET:}
    bucket: ${ALIOSS_BUCKET_NAME:}

# Text splitter configuration (used by AdvancedTextSplitter)
splitter:
  chunk-size: 1200
  overlap: 200
  chinese-tokenize: true
pipeline:
  enricher-enable: false