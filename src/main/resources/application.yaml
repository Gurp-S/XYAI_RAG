spring:
  application:
    name: My-AI
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/my_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:727Gx724}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      timeout: 3s
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: deepseek-r1:8b
          temperature: 0.1
          keep-alive: 24h

app:
  memory:
    store: mysql

logging:
  level:
    org.XYai.myai: debug
ragent:
  trace:
    enabled: true  # 生产环境启用，用于问题排查和性能监控
    # enabled: false  # 开发环境可关闭，提升性能
