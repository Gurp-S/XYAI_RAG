spring:
  application:
    name: My-AI
  profiles:
    active: local
  datasource:
    url: ${SPRING_MYSQL_URL:jdbc:mysql://localhost:3306/my_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    # Move sensitive defaults into application-local.yaml or environment variables
    username: ${SPRING_MYSQL_USERNAME:}
    password: ${SPRING_MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/MYsql.sql
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      database: ${SPRING_REDIS_DB:0}
      timeout: 3s
  ai:
    openai:
      api-key: ${ALIYUN_BAILIAN_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen3.5-122b-a10b
          temperature: 0.3
          maxTokens: 1000
          internal-tool-execution-enabled: true
          parallel-tool-calls: false
    dashscope:
      api-key: ${ALIYUN_BAILIAN_API_KEY:}  # 可复用同一个 Key
      rerank:
        enabled: true
        model: gte-rerank
        # 可选：自定义超时/重试
        timeout: 10s
        max-retries: 3
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: qwen3-embedding
    vectorstore:
      milvus:
        client:
          host: localhost
          port: 19530
        databaseName: my_xy
        collectionName: my_ai
        embeddingDimension: 4096
        metricType: COSINE
        initialize-schema: true
        index-type: ivf_flat
        index-params:
          nlist: 1024
    mcp:
      client:
        toolcallback:
          enabled: true
        name: mcp-client
      a
        type: async



jwt:
  issuer: XYai
  access-token-exp-sec: 900
  refresh-token-exp-sec: 1209600
  refresh-cookie-name: refresh_token
  header: Authorization
  prefix: Bearer
  http-secure: false
  rsa-private-key-path: D:/lea/xyai/config/keys/private_pkcs8.pem
  rsa-public-key-path: D:/lea/xyai/config/keys/public_x509.pem

